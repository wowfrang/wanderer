name: TestFlight

# Every push to main: run the core tests, build, sign and upload to TestFlight.
# Secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID  App Store Connect API key (Admin role, for cloud signing)
#   ASC_KEY_P8                 contents of the AuthKey_<id>.p8 file
#   APPLE_TEAM_ID              developer team ID
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Core tests
        working-directory: Packages/WandererCore
        run: swift test

      - name: Install API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Missing ASC_KEY_ID / ASC_KEY_P8 secrets. See README → Continuous delivery."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Ensure TestFlight testers
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TESTER_EMAILS: ${{ vars.TESTFLIGHT_TESTERS || 'erik.rothoff@gmail.com' }}
          ASC_APP_ID: '6838663568'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]"
          ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" "$RUNNER_TEMP/venv/bin/python" scripts/testflight_testers.py

      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          scripts/testflight.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: ~/Library/Logs/DiagnosticReports
          if-no-files-found: ignore
